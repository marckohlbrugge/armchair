# Audit all gems listed in the Gemfile for known security problems by running bin/bundler-audit.
# CVEs that are not relevant to the application can be enumerated on the ignore list below.

# Polynomial ReDoS in ruby_llm 1.x think-tag parsing, Mistral capability matching,
# and Utils.underscore. The advisories reproduce on Ruby 3.1; 3.2 and later
# bound that backtracking. This app runs 3.4. The fix is ruby_llm 2, which
# replaces RubyLLM::Schema.
ignore:
  - CVE-2026-67987
  - CVE-2026-67989
  - CVE-2026-67991
